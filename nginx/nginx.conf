events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Per-IP rate limits (edge protection before fail2ban)
    limit_req_zone $binary_remote_addr zone=veritrail_general:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=veritrail_probe:10m rate=2r/s;
    limit_req_status 429;

    log_format veritrail_combined '$remote_addr - $remote_user [$time_local] '
                            '"$request" $status $body_bytes_sent '
                            '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log veritrail_combined;
    error_log  /var/log/nginx/error.log warn;

    # Security headers (shared)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    server_tokens off;

    # HTTP → HTTPS redirect for all hosts
    server {
        listen 80;
        server_name app.veritrail.io api.veritrail.io;
        limit_req zone=veritrail_general burst=30 nodelay;

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Frontend — app.veritrail.io
    server {
        listen 443 ssl;
        server_name app.veritrail.io;

        ssl_certificate     /etc/letsencrypt/live/app.veritrail.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.veritrail.io/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.veritrail.io; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        location ~* \.(env|sql|php|bak|ini|old|orig|backup|swp|git|yml|yaml|aws|credentials)(/|$) {
            limit_req zone=veritrail_probe burst=3 nodelay;
            return 404;
        }
        location ~* (phpinfo|shell\.php|wp-admin|\.git/|/\.vscode) {
            limit_req zone=veritrail_probe burst=3 nodelay;
            return 404;
        }

        include /etc/nginx/iap/iap.oauth2.conf;

        include /etc/nginx/public-app-routes.conf;

        location / {
            include /etc/nginx/iap/iap.auth.conf;
            limit_req zone=veritrail_general burst=40 nodelay;
            proxy_pass         http://web:80;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }

    # API — api.veritrail.io
    server {
        listen 443 ssl;
        server_name api.veritrail.io;

        ssl_certificate     /etc/letsencrypt/live/app.veritrail.io/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.veritrail.io/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'" always;

        location ~* \.(env|sql|php|bak|ini|old|orig|backup|swp|git|yml|yaml|aws|credentials)(/|$) {
            limit_req zone=veritrail_probe burst=3 nodelay;
            return 404;
        }
        location ~* (phpinfo|shell\.php|wp-admin|\.git/|/\.vscode) {
            limit_req zone=veritrail_probe burst=3 nodelay;
            return 404;
        }

        include /etc/nginx/iap/iap.oauth2.conf;

        location /healthz {
            limit_req zone=veritrail_general burst=60 nodelay;
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /v1/auth/ {
            limit_req zone=veritrail_general burst=60 nodelay;
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /v1/integrations/ {
            limit_req zone=veritrail_general burst=60 nodelay;
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /v1/public/ {
            limit_req zone=veritrail_general burst=60 nodelay;
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location / {
            include /etc/nginx/iap/iap.auth.conf;
            limit_req zone=veritrail_general burst=60 nodelay;
            proxy_pass         http://api:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }
    }
}
