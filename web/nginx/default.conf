server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Integration logos live under /integrations/*.png but /integrations is also a SPA route.
    # try_files $uri $uri/ would hit the static directory and return 403 (no index, autoindex off).
    location ~ ^/integrations/[^/]+\.(png|svg|webp|jpe?g|gif|ico)$ {
        try_files $uri =404;
    }

    location = /integrations {
        try_files /index.html =404;
    }

    location = /integrations/ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
