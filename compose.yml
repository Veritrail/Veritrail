name: vigil

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hygiene}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hygiene}
      POSTGRES_DB: ${POSTGRES_DB:-hygiene}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hygiene}:${POSTGRES_PASSWORD:-hygiene}@db:5432/${POSTGRES_DB:-hygiene}
      REDIS_URL: redis://redis:6379/0
      # Region only here — SSO/static keys come from env_file + ~/.aws mount (never pass empty AWS_*).
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./api:/app
      - ./infra:/infra:ro
      # Mounted for SSO token cache. Omit this volume if using static keys only.
      - ${HOME}/.aws:/root/.aws:rw

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hygiene}:${POSTGRES_PASSWORD:-hygiene}@db:5432/${POSTGRES_DB:-hygiene}
      REDIS_URL: redis://redis:6379/0
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: watchfiles --filter python "celery -A app.worker.celery_app worker --loglevel=info --concurrency=4" app
    volumes:
      - ./api:/app
      - ${HOME}/.aws:/root/.aws:rw

  beat:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-hygiene}:${POSTGRES_PASSWORD:-hygiene}@db:5432/${POSTGRES_DB:-hygiene}
      REDIS_URL: redis://redis:6379/0
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app beat --loglevel=info
    volumes:
      - ./api:/app

  web:
    build:
      context: ./web
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "127.0.0.1:5173:5173"
    command: npm run dev -- --host 0.0.0.0
    volumes:
      - ./web:/app
      - /app/node_modules

  nginx:
    image: nginx:alpine
    profiles: ["prod"]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - api
      - web

  backup:
    image: postgres:16-alpine
    profiles: ["prod"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hygiene}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hygiene}
      POSTGRES_DB: ${POSTGRES_DB:-hygiene}
      B2_BUCKET: ${B2_BUCKET:-}
      B2_KEY_ID: ${B2_KEY_ID:-}
      B2_APPLICATION_KEY: ${B2_APPLICATION_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    # Runs once at container start — trigger nightly via cron on the host or
    # via `docker compose --profile prod run --rm backup`
    entrypoint: /bin/sh
    command: >
      -c "
        set -e
        DUMP_FILE=/tmp/vigil_$$(date +%Y%m%d_%H%M%S).dump
        pg_dump -h db -U $$POSTGRES_USER -Fc $$POSTGRES_DB > $$DUMP_FILE
        echo \"Dump written: $$DUMP_FILE ($$(du -sh $$DUMP_FILE | cut -f1))\"
        if [ -n \"$$B2_KEY_ID\" ]; then
          apk add --no-cache curl >/dev/null 2>&1
          echo 'Uploading to Backblaze B2...'
          curl -s -u $$B2_KEY_ID:$$B2_APPLICATION_KEY \\
            -T $$DUMP_FILE \\
            https://s3.us-west-004.backblazeb2.com/$$B2_BUCKET/$$(basename $$DUMP_FILE) \\
            && echo 'Upload complete' || echo 'Upload failed (check B2 credentials)'
        else
          echo 'B2 not configured — dump saved locally only (not persisted outside container)'
        fi
      "
    restart: "no"

volumes:
  db_data:
