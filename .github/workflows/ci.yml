name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start Postgres and Redis
        run: docker compose up -d db redis

      - name: Run API tests
        env:
          ENV_FILE: .env.example
        run: |
          docker compose run --rm api alembic upgrade head
          docker compose run --rm api pytest -q

  api-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install mypy
        run: pip install mypy

      - name: Run mypy
        working-directory: api
        run: |
          pip install -r requirements.txt
          mypy app/ --ignore-missing-imports --check-untyped-defs || echo "::warning ::mypy found issues (non-blocking)"

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install and build frontend
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
          npm run build

      - name: Lint frontend
        working-directory: web
        run: npm run lint

      - name: Resource-affected reason fixtures
        working-directory: web
        run: npm run test:resource-affected

  env-file-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Block tracked env files
        run: |
          if git ls-files '.env' '.env.prod' '.env.local' | grep -q .; then
            echo "Tracked env files found — remove from git and rotate secrets"
            git ls-files '.env' '.env.prod' '.env.local'
            exit 1
          fi
