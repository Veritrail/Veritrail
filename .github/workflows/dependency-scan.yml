name: Dependency scan

on:
  push:
    branches: [main, staging, dev]
  pull_request:

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: npm audit (web)
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=critical
          npm audit --audit-level=high || echo "::warning ::npm audit reported high vulnerabilities in web/ (non-blocking; fix via Dependabot or manual upgrade)"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: pip-audit (api)
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.txt --progress-spinner off --format json -o /tmp/pip-audit.json || true
          python3 - <<'PY'
          import json, sys
          try:
              data = json.load(open("/tmp/pip-audit.json"))
          except (FileNotFoundError, json.JSONDecodeError):
              sys.exit(0)
          deps = data if isinstance(data, list) else data.get("dependencies", [])
          crits = highs = 0
          for dep in deps:
              for vuln in dep.get("vulns", []):
                  sev = (vuln.get("severity") or "").upper()
                  if sev == "CRITICAL":
                      crits += 1
                  elif sev == "HIGH":
                      highs += 1
          if highs:
              print(f"::warning ::pip-audit reported {highs} high-severity vulnerabilities in api/ (non-blocking)")
          if crits:
              print(f"::error ::pip-audit reported {crits} critical vulnerabilities in api/")
              sys.exit(1)
          PY
