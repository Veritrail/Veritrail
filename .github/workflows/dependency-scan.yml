name: Dependency scan

on:
  push:
    branches: [main, staging, dev]
  pull_request:

jobs:
  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: npm audit (web)
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=critical
          npm audit --audit-level=high || echo "::warning ::npm audit reported high vulnerabilities in web/ (non-blocking; fix via Dependabot or manual upgrade)"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: pip-audit (api)
        run: |
          pip install pip-audit
          pip-audit -r api/requirements.txt --progress-spinner off
