# Hot-reload override for the EC2/prod compose stack.
#
# Use only for private/staging-style deployments:
#   ./scripts/launch-prod.sh --deploy-only --hot-reload
#
# This keeps nginx/TLS/prod env wiring, but runs mutable bind-mounted app code.

services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./api:/app
      - ./web:/web:ro
      - ./infra:/infra:ro
      - ./data/uploads:/app/data/uploads
      - ./veritrail.json:/app/veritrail.json:ro

  worker:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: watchfiles --filter python "celery -A app.worker.celery_app worker --loglevel=info --concurrency=4" app
    volumes:
      - ./api:/app
      - ./veritrail.json:/app/veritrail.json:ro

  beat:
    build:
      context: .
      dockerfile: api/Dockerfile
    command: celery -A app.worker.celery_app beat --loglevel=info
    volumes:
      - ./api:/app

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 80 --strictPort"
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_DEV_API_PROXY: http://api:8000
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    volumes:
      - ./web:/app
      - /app/node_modules
