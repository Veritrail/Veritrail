# Hetzner/VPS IAM Roles Anywhere runtime mounts.
#
# Use after compose.prod.yml when AWS_PROFILE points at a profile that uses
# aws_signing_helper credential_process:
#   docker compose -f compose.yml -f compose.prod.yml -f compose.hetzner-rolesanywhere.yml --env-file .env.prod --profile prod up -d

x-roles-anywhere-runtime: &roles-anywhere-runtime
  environment:
    AWS_SDK_LOAD_CONFIG: ${AWS_SDK_LOAD_CONFIG:-1}
    AWS_PROFILE: ${AWS_PROFILE}
    AWS_CONFIG_FILE: /root/.aws/config
    # Force boto3 onto the profile credential_process even if legacy static keys
    # are still present in .env.prod. The app strips empty AWS_* values at boot.
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    AWS_SESSION_TOKEN: ""
  volumes:
    - ${AWS_CONFIG_DIR:-/root/.aws}:/root/.aws:ro
    - /etc/veritrail/aws-ra:/etc/veritrail/aws-ra:ro
    - /usr/local/bin/aws_signing_helper:/usr/local/bin/aws_signing_helper:ro

services:
  api:
    <<: *roles-anywhere-runtime

  worker:
    <<: *roles-anywhere-runtime

  beat:
    <<: *roles-anywhere-runtime
