# Ban IPs probing common exploit paths in edge nginx access logs.
# Log format: veritrail_combined (nginx combined-style).
#
# Note: do not use \S+ for remote_user — when user is "-" it greedily consumes
# the "[" starting the timestamp. Use ".+" between client and request instead.
[Definition]
failregex = ^<ADDR> - .+ "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS) \S*(?:\.env|wp-admin|wp-login|xmlrpc\.php|\.git|phpunit|cgi-bin|\.\./|%%2e%%2e|%%2E%%2E|/etc/passwd|/proc/self|eval-stdin\.php|vendor/phpunit|actuator|\.aws/|\.ssh/|config\.json|database\.yml|web\.config|\.bak|\.sql|setup\.php|phpinfo|/console/|/solr/|/jenkins/|/manager/html)\S* HTTP/[\d.]+" (?:404|301|403|400|405)
ignoreregex =
