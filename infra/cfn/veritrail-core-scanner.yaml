AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Veritrail Core Scanner v2026.06 — read-only AWS access for compliance scanning. Optional
  Access Analyzer policy-generation permissions attach only when EnableAdvancedPolicyGeneration=Yes.

Metadata:
  VeritrailVersion: "2026.06"
  VeritrailTemplate: veritrail-core-scanner

Parameters:
  VeritrailAccountPrincipal:
    Type: String
    Description: ARN of the Veritrail control plane principal (provided during onboarding).
  ExternalId:
    Type: String
    Description: Unique ExternalId issued at onboarding. Required to assume the role.
    NoEcho: true
  RoleName:
    Type: String
    Default: VeritrailScannerRole
    Description: Veritrail connector role name. Do not rename on stack updates.
  EnableAdvancedPolicyGeneration:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
    Description: >
      Attach VeritrailAdvancedPolicyGeneration inline policy (IAM/Access Analyzer analysis jobs only;
      does not modify customer resources).
  CloudTrailLogsBucketName:
    Type: String
    Default: ""
    Description: >
      S3 bucket where CloudTrail delivers logs (name only). Optional; leave empty to allow the
      monitor role broad S3 read for policy generation. Set for least-privilege bucket scope.
  CloudTrailLogsBucketPrefix:
    Type: String
    Default: "AWSLogs/"
    Description: Key prefix under the bucket (include trailing slash if used).
  CloudTrailLogsKmsKeyArn:
    Type: String
    Default: ""
    Description: KMS key ARN if trail log objects use SSE-KMS (optional).

Conditions:
  CreateAdvancedPolicyGeneration: !Equals [!Ref EnableAdvancedPolicyGeneration, "Yes"]
  CreateMonitorRole: !Equals [!Ref EnableAdvancedPolicyGeneration, "Yes"]
  HasCloudTrailBucket: !Not [!Equals [!Ref CloudTrailLogsBucketName, ""]]
  HasCloudTrailKmsKey: !Not [!Equals [!Ref CloudTrailLogsKmsKeyArn, ""]]

Resources:
  VeritrailRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Ref RoleName
      Description: Veritrail read-only compliance scanner. No write access to customer resources.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Ref VeritrailAccountPrincipal
            Action:
              - sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
          - Effect: Allow
            Principal:
              AWS: !Ref VeritrailAccountPrincipal
            Action:
              - sts:SetSourceIdentity
              - sts:TagSession
      Policies:
        - PolicyName: VeritrailMinimalReadOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: IamUserAndKeyEnumeration
                Effect: Allow
                Action:
                  - iam:ListUsers
                  - iam:ListMFADevices
                  - iam:GetLoginProfile
                  - iam:ListAccessKeys
                  - iam:GetAccessKeyLastUsed
                  - iam:GetAccountSummary
                  - iam:ListAccountAliases
                  - iam:GetAccountPasswordPolicy
                Resource: "*"
              - Sid: IamRoleEnumeration
                Effect: Allow
                Action:
                  - iam:ListRoles
                  - iam:ListRolePolicies
                  - iam:GetRolePolicy
                  - iam:ListAttachedRolePolicies
                  - iam:GetPolicy
                  - iam:GetPolicyVersion
                  - iam:ListPolicies
                Resource: "*"
              - Sid: IamServiceLastAccessedRead
                Effect: Allow
                Action:
                  - iam:GetServiceLastAccessedDetails
                Resource: "*"
              - Sid: IamServerCertificates
                Effect: Allow
                Action:
                  - iam:ListServerCertificates
                  - iam:GetServerCertificate
                Resource: "*"
              - Sid: AccountContacts
                Effect: Allow
                Action:
                  - account:GetContactInformation
                  - account:GetAlternateContact
                  - account:GetAccountInformation
                Resource: "*"
              - Sid: S3BucketConfiguration
                Effect: Allow
                Action:
                  - s3:ListAllMyBuckets
                  - s3:GetAccountPublicAccessBlock
                  - s3:GetBucketLogging
                  - s3:GetEncryptionConfiguration
                  - s3:GetBucketVersioning
                  - s3:GetBucketPublicAccessBlock
                  - s3:GetBucketPolicy
                  - s3:GetBucketAcl
                Resource: "*"
              - Sid: KmsKeyConfiguration
                Effect: Allow
                Action:
                  - kms:ListKeys
                  - kms:DescribeKey
                  - kms:GetKeyRotationStatus
                  - kms:GetKeyPolicy
                  - kms:ListAliases
                Resource: "*"
              - Sid: CloudTrailConfiguration
                Effect: Allow
                Action:
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrailStatus
                  - cloudtrail:LookupEvents
                Resource: "*"
              - Sid: AwsBackupConfiguration
                Effect: Allow
                Action:
                  - backup:ListBackupPlans
                  - backup:ListBackupVaults
                Resource: "*"

              - Sid: GuardDutyConfiguration
                Effect: Allow
                Action:
                  - guardduty:ListDetectors
                  - guardduty:GetDetector
                  - guardduty:ListFindings
                  - guardduty:GetFindings
                Resource: "*"
              - Sid: SecurityHubConfiguration
                Effect: Allow
                Action:
                  - securityhub:DescribeHub
                Resource: "*"
              - Sid: VpcAndSecurityGroupEnumeration
                Effect: Allow
                Action:
                  - ec2:DescribeRegions
                  - ec2:DescribeVpcs
                  - ec2:DescribeFlowLogs
                  - ec2:DescribeSecurityGroups
                Resource: "*"
              - Sid: Ec2InstanceEnumeration
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeVolumes
                  - ec2:DescribeSnapshots
                  - ec2:DescribeSnapshotAttribute
                  - ec2:DescribeImages
                  - ec2:GetEbsEncryptionByDefault
                Resource: "*"
              - Sid: AccessAnalyzerEnumeration
                Effect: Allow
                Action:
                  - access-analyzer:ListAnalyzers
                Resource: "*"
              - Sid: ConfigServiceConfiguration
                Effect: Allow
                Action:
                  - config:DescribeConfigurationRecorders
                  - config:DescribeConfigurationRecorderStatus
                  - config:DescribeDeliveryChannels
                  - config:DescribeComplianceByConfigRule
                Resource: "*"
              - Sid: IdentityCenterDirectory
                Effect: Allow
                Action:
                  - sso:ListInstances
                  - sso:DescribeInstance
                  - sso:ListPermissionSets
                  - sso:DescribePermissionSet
                  - sso:ListAccountsForProvisionedPermissionSet
                  - sso:ListAccountAssignments
                  - identitystore:ListUsers
                  - identitystore:DescribeUser
                  - identitystore:DescribeGroup
                Resource: "*"
              - Sid: RdsConfiguration
                Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                  - rds:DescribeDBSnapshots
                  - rds:DescribeDBSnapshotAttributes
                Resource: "*"
              - Sid: AcmCertificates
                Effect: Allow
                Action:
                  - acm:ListCertificates
                  - acm:DescribeCertificate
                Resource: "*"
              - Sid: LambdaConfiguration
                Effect: Allow
                Action:
                  - lambda:ListFunctions
                  - lambda:GetFunctionEventInvokeConfig
                Resource: "*"
              - Sid: SecretsManagerConfiguration
                Effect: Allow
                Action:
                  - secretsmanager:ListSecrets
                Resource: "*"
              - Sid: SsmParameters
                Effect: Allow
                Action:
                  - ssm:DescribeParameters
                Resource: "*"
              - Sid: ElbConfiguration
                Effect: Allow
                Action:
                  - elasticloadbalancing:DescribeLoadBalancers
                  - elasticloadbalancing:DescribeLoadBalancerAttributes
                  - elasticloadbalancing:DescribeListeners
                Resource: "*"
              - Sid: DynamoDbConfiguration
                Effect: Allow
                Action:
                  - dynamodb:ListTables
                  - dynamodb:DescribeTable
                  - dynamodb:DescribeContinuousBackups
                Resource: "*"
              - Sid: SnsConfiguration
                Effect: Allow
                Action:
                  - sns:ListTopics
                  - sns:GetTopicAttributes
                Resource: "*"
              - Sid: SqsConfiguration
                Effect: Allow
                Action:
                  - sqs:ListQueues
                  - sqs:GetQueueAttributes
                Resource: "*"
              - Sid: EcrConfiguration
                Effect: Allow
                Action:
                  - ecr:DescribeRepositories
                  - ecr:GetRegistryScanningConfiguration
                Resource: "*"
              - Sid: EksConfiguration
                Effect: Allow
                Action:
                  - eks:ListClusters
                  - eks:DescribeCluster
                Resource: "*"
              - Sid: EcsConfiguration
                Effect: Allow
                Action:
                  - ecs:ListClusters
                  - ecs:DescribeClusters
                  - ecs:ListServices
                  - ecs:DescribeServices
                  - ecs:DescribeTaskDefinition
                Resource: "*"
              - Sid: InspectorConfiguration
                Effect: Allow
                Action:
                  - inspector2:BatchGetAccountStatus
                  - inspector2:ListCoverage
                  - inspector2:ListFindings
                  - inspector2:BatchGetFindingDetails
                Resource: "*"
              - Sid: OrganizationsAccountLabel
                Effect: Allow
                Action:
                  - organizations:DescribeAccount
                Resource: "*"

  VeritrailAccessAnalyzerMonitorRole:
    Type: AWS::IAM::Role
    Condition: CreateMonitorRole
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub "${RoleName}AccessAnalyzerMonitor"
      Description: IAM Access Analyzer policy-generation monitor role for Veritrail.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: access-analyzer.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VeritrailAccessAnalyzerMonitorRead
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: CloudTrailDiscovery
                Effect: Allow
                Action:
                  - cloudtrail:DescribeTrails
                  - cloudtrail:GetTrail
                  - cloudtrail:GetTrailStatus
                Resource: "*"
              - Sid: CloudTrailLogRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: "*"
              - !If
                - HasCloudTrailKmsKey
                - Sid: CloudTrailKmsDecrypt
                  Effect: Allow
                  Action:
                    - kms:Decrypt
                  Resource: !Ref CloudTrailLogsKmsKeyArn
                - !Ref AWS::NoValue

  AdvancedPolicyGenerationPolicy:
    Type: AWS::IAM::Policy
    Condition: CreateAdvancedPolicyGeneration
    Properties:
      PolicyName: VeritrailAdvancedPolicyGeneration
      Roles: [!Ref VeritrailRole]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AccessAnalyzerPolicyGeneration
            Effect: Allow
            Action:
              - iam:GenerateServiceLastAccessedDetails
              - access-analyzer:StartPolicyGeneration
              - access-analyzer:GetGeneratedPolicy
              - access-analyzer:CancelPolicyGeneration
              - access-analyzer:ListPolicyGenerations
            Resource: "*"
          - Sid: PassAccessAnalyzerMonitorRole
            Effect: Allow
            Action: iam:PassRole
            Resource: !GetAtt VeritrailAccessAnalyzerMonitorRole.Arn
            Condition:
              StringEquals:
                iam:PassedToService: access-analyzer.amazonaws.com

Outputs:
  RoleArn:
    Value: !GetAtt VeritrailRole.Arn
  RoleName:
    Value: !Ref VeritrailRole
  AdvancedPolicyGenerationRoleArn:
    Condition: CreateAdvancedPolicyGeneration
    Value: !GetAtt VeritrailRole.Arn
  AccessAnalyzerMonitorRoleArn:
    Condition: CreateMonitorRole
    Value: !GetAtt VeritrailAccessAnalyzerMonitorRole.Arn
