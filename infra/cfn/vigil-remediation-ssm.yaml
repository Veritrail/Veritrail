AWSTemplateFormatVersion: "2010-09-09"
Description: Customer-owned Vigil remediation runbooks using AWS Systems Manager Automation.

Parameters:
  AutomationRoleName:
    Type: String
    Default: VigilRemediationAutomationRole
  EnableSecurityGroupRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableS3Remediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableIamAccessKeyRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableIamPolicyRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableSsmParameterRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableCloudTrailRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]

Conditions:
  SecurityGroupModule: !Equals [!Ref EnableSecurityGroupRemediation, "Yes"]
  S3Module: !Equals [!Ref EnableS3Remediation, "Yes"]
  IamAccessKeyModule: !Equals [!Ref EnableIamAccessKeyRemediation, "Yes"]
  IamPolicyModule: !Equals [!Ref EnableIamPolicyRemediation, "Yes"]
  SsmParameterModule: !Equals [!Ref EnableSsmParameterRemediation, "Yes"]
  CloudTrailModule: !Equals [!Ref EnableCloudTrailRemediation, "Yes"]

Resources:
  RemediationAutomationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref AutomationRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VigilRemediationAutomation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - !If
                - SecurityGroupModule
                - Sid: Ec2SecurityGroupIngress
                  Effect: Allow
                  Action:
                    - ec2:DescribeSecurityGroups
                    - ec2:DescribeSecurityGroupRules
                    - ec2:RevokeSecurityGroupIngress
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - S3Module
                - Sid: S3PublicAccessRemediation
                  Effect: Allow
                  Action:
                    - s3:PutBucketPublicAccessBlock
                    - s3:GetBucketPublicAccessBlock
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - SsmParameterModule
                - Sid: SsmParameterSecureStringMigration
                  Effect: Allow
                  Action:
                    - ssm:GetParameter
                    - ssm:PutParameter
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - IamAccessKeyModule
                - Sid: IamAccessKeyRemediation
                  Effect: Allow
                  Action:
                    - iam:UpdateAccessKey
                    - iam:GetAccessKeyLastUsed
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - IamPolicyModule
                - Sid: IamPolicyRemediation
                  Effect: Allow
                  Action:
                    - iam:PutRolePolicy
                    - iam:DetachRolePolicy
                    - iam:AttachRolePolicy
                    - iam:CreatePolicyVersion
                    - iam:DeletePolicyVersion
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - CloudTrailModule
                - Sid: CloudTrailRemediation
                  Effect: Allow
                  Action:
                    - cloudtrail:UpdateTrail
                    - cloudtrail:StartLogging
                  Resource: "*"
                - !Ref AWS::NoValue

  RevokeSecurityGroupIngressExact:
    Type: AWS::SSM::Document
    Condition: SecurityGroupModule
    Properties:
      Name: Vigil-RevokeSecurityGroupIngressExact
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        schemaVersion: "0.3"
        description: "Vigil: remove only the public security-group ingress rules approved in a signed plan."
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: Signed Vigil remediation plan JSON.
        mainSteps:
          - name: RevokeIngress
            action: aws:executeScript
            timeoutSeconds: 180
            inputs:
              Runtime: python3.11
              Handler: handler
              InputPayload:
                PlanJson: "{{ PlanJson }}"
              Script: |
                import datetime, hashlib, json, boto3
                PLAN_SCHEMA = "vigil_remediation_plan/v2"
                ALLOWED = {"ec2.security_group.unrestricted_ssh", "ec2.security_group.unrestricted_rdp"}

                def finish(plan, result):
                    result["plan_id"] = plan.get("plan_id")
                    return result

                def verify(plan):
                    if plan.get("schema") != PLAN_SCHEMA:
                        return "unsupported schema"
                    if plan.get("check_id") not in ALLOWED:
                        return "unsupported check_id"
                    exp = datetime.datetime.fromisoformat(plan["expires_at"].replace("Z", "+00:00"))
                    if exp.tzinfo is None:
                        exp = exp.replace(tzinfo=datetime.timezone.utc)
                    if datetime.datetime.now(datetime.timezone.utc) > exp:
                        return "plan_expired"
                    expected = plan.get("content_sha256")
                    if expected:
                        body = {k: v for k, v in plan.items() if k not in ("content_sha256", "signature")}
                        canonical = json.dumps(body, sort_keys=True, separators=(",", ":"))
                        if hashlib.sha256(canonical.encode()).hexdigest() != expected:
                            return "content_sha256_mismatch"
                    return None

                def region(plan):
                    return plan.get("resource_region") or (plan.get("evidence") or {}).get("region") or "us-east-1"

                def group_id(plan):
                    ev = plan.get("evidence") or {}
                    if ev.get("group_id"):
                        return str(ev["group_id"])
                    arn = plan.get("resource_arn") or ""
                    if "/security-group/" in arn:
                        return arn.split("/security-group/")[-1]
                    return arn.rsplit("/", 1)[-1]

                def rule_matches(perm, rule, cidr):
                    if cidr != rule.get("cidr"):
                        return False
                    proto = str(perm.get("IpProtocol", ""))
                    wanted = rule.get("protocol")
                    if wanted not in ("all", proto, "-1") and proto not in ("-1", str(wanted)):
                        return False
                    for key in ("from_port", "to_port"):
                        if rule.get(key) is None and perm.get(key[0].upper() + key[1:].replace("_", "")) is None:
                            continue
                        pkey = "FromPort" if key == "from_port" else "ToPort"
                        if int(rule.get(key)) != int(perm.get(pkey)):
                            return False
                    return True

                def handler(event, context):
                    plan = json.loads(event["PlanJson"])
                    err = verify(plan)
                    if err:
                        return finish(plan, {"ok": False, "error": err})
                    sg_id = group_id(plan)
                    rules = plan.get("exact_match_rules") or []
                    if not sg_id or not rules:
                        return finish(plan, {"ok": False, "error": "stale_plan"})
                    ec2 = boto3.client("ec2", region_name=region(plan))
                    sg = ec2.describe_security_groups(GroupIds=[sg_id])["SecurityGroups"][0]
                    revoked = 0
                    for perm in sg.get("IpPermissions", []):
                        for key, cidr_key, public in (("IpRanges", "CidrIp", "0.0.0.0/0"), ("Ipv6Ranges", "CidrIpv6", "::/0")):
                            for rng in perm.get(key, []):
                                cidr = rng.get(cidr_key)
                                if cidr != public:
                                    continue
                                if not any(rule_matches(perm, rule, cidr) for rule in rules):
                                    continue
                                ip_perm = {"IpProtocol": perm.get("IpProtocol")}
                                if perm.get("IpProtocol") != "-1":
                                    ip_perm["FromPort"] = perm.get("FromPort")
                                    ip_perm["ToPort"] = perm.get("ToPort")
                                ip_perm[key] = [{cidr_key: cidr}]
                                ec2.revoke_security_group_ingress(GroupId=sg_id, IpPermissions=[ip_perm])
                                revoked += 1
                    return finish(plan, {"ok": revoked > 0, "action": "revoke_exact_ingress", "group_id": sg_id, "revoked": revoked})

  DeactivateIamAccessKey:
    Type: AWS::SSM::Document
    Condition: IamAccessKeyModule
    Properties:
      Name: Vigil-DeactivateIamAccessKey
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        schemaVersion: "0.3"
        description: "Vigil: deactivate only the IAM access key approved in a signed plan."
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: Signed Vigil remediation plan JSON.
        mainSteps:
          - name: DeactivateAccessKey
            action: aws:executeScript
            timeoutSeconds: 120
            inputs:
              Runtime: python3.11
              Handler: handler
              InputPayload:
                PlanJson: "{{ PlanJson }}"
              Script: |
                import datetime, hashlib, json, boto3
                ALLOWED = {"iam.access_key.unused_45d", "iam.access_key.unused_90d"}

                def finish(plan, result):
                    result["plan_id"] = plan.get("plan_id")
                    return result

                def verify(plan):
                    if plan.get("check_id") not in ALLOWED:
                        return "unsupported check_id"
                    exp = datetime.datetime.fromisoformat(plan["expires_at"].replace("Z", "+00:00"))
                    if exp.tzinfo is None:
                        exp = exp.replace(tzinfo=datetime.timezone.utc)
                    if datetime.datetime.now(datetime.timezone.utc) > exp:
                        return "plan_expired"
                    expected = plan.get("content_sha256")
                    if expected:
                        body = {k: v for k, v in plan.items() if k not in ("content_sha256", "signature")}
                        canonical = json.dumps(body, sort_keys=True, separators=(",", ":"))
                        if hashlib.sha256(canonical.encode()).hexdigest() != expected:
                            return "content_sha256_mismatch"
                    return None

                def key_context(plan):
                    ev = plan.get("evidence") or {}
                    user_arn, key_id = ev.get("user_arn"), ev.get("key_id")
                    if not user_arn or not key_id:
                        raw = plan.get("resource_arn") or ""
                        if "#" in raw:
                            user_arn, key_id = raw.split("#", 1)
                    user_name = user_arn.split("/")[-1] if user_arn and "/" in user_arn else user_arn
                    return user_name, key_id

                def handler(event, context):
                    plan = json.loads(event["PlanJson"])
                    err = verify(plan)
                    if err:
                        return finish(plan, {"ok": False, "error": err})
                    user_name, key_id = key_context(plan)
                    if not user_name or not key_id:
                        return finish(plan, {"ok": False, "error": "missing user or key"})
                    boto3.client("iam").update_access_key(UserName=user_name, AccessKeyId=key_id, Status="Inactive")
                    return finish(plan, {"ok": True, "action": "deactivate_access_key", "user_name": user_name, "key_id": key_id, "status": "Inactive"})

  MigrateSsmParameterToSecureString:
    Type: AWS::SSM::Document
    Condition: SsmParameterModule
    Properties:
      Name: Vigil-MigrateSsmParameterToSecureString
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        schemaVersion: "0.3"
        description: "Vigil: rewrite a reviewed plaintext SSM String parameter as SecureString."
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: Signed Vigil remediation plan JSON.
        mainSteps:
          - name: MigrateParameter
            action: aws:executeScript
            timeoutSeconds: 120
            inputs:
              Runtime: python3.11
              Handler: handler
              InputPayload:
                PlanJson: "{{ PlanJson }}"
              Script: |
                import datetime, hashlib, json, boto3

                def finish(plan, result):
                    result["plan_id"] = plan.get("plan_id")
                    return result

                def verify(plan):
                    if plan.get("check_id") != "ssm.parameter.plaintext_secret":
                        return "unsupported check_id"
                    exp = datetime.datetime.fromisoformat(plan["expires_at"].replace("Z", "+00:00"))
                    if exp.tzinfo is None:
                        exp = exp.replace(tzinfo=datetime.timezone.utc)
                    if datetime.datetime.now(datetime.timezone.utc) > exp:
                        return "plan_expired"
                    expected = plan.get("content_sha256")
                    if expected:
                        body = {k: v for k, v in plan.items() if k not in ("content_sha256", "signature")}
                        canonical = json.dumps(body, sort_keys=True, separators=(",", ":"))
                        if hashlib.sha256(canonical.encode()).hexdigest() != expected:
                            return "content_sha256_mismatch"
                    return None

                def parameter_name(plan):
                    ev = plan.get("evidence") or {}
                    if ev.get("parameter_name"):
                        return str(ev["parameter_name"])
                    arn = plan.get("resource_arn") or ""
                    if ":parameter/" in arn:
                        return "/" + arn.split(":parameter/", 1)[-1]
                    if ":parameter" in arn:
                        return arn.split(":parameter", 1)[-1]
                    return ""

                def region(plan):
                    return plan.get("resource_region") or (plan.get("evidence") or {}).get("region") or "us-east-1"

                def handler(event, context):
                    plan = json.loads(event["PlanJson"])
                    err = verify(plan)
                    if err:
                        return finish(plan, {"ok": False, "error": err})
                    name = parameter_name(plan)
                    if not name:
                        return finish(plan, {"ok": False, "error": "missing parameter name"})
                    ssm = boto3.client("ssm", region_name=region(plan))
                    current = ssm.get_parameter(Name=name, WithDecryption=False)["Parameter"]
                    if current.get("Type") == "SecureString":
                        return finish(plan, {"ok": True, "changed": False, "parameter_name": name, "parameter_type": "SecureString"})
                    if current.get("Type") != "String":
                        return finish(plan, {"ok": False, "error": f"unsupported parameter type {current.get('Type')}"})
                    ssm.put_parameter(Name=name, Type="SecureString", Value=current["Value"], Overwrite=True)
                    return finish(plan, {"ok": True, "changed": True, "action": "migrate_ssm_string_to_secure_string", "parameter_name": name, "parameter_type": "SecureString"})

Outputs:
  AutomationDocumentName:
    Value: Vigil-RemediationPlanExecutor
  SecurityGroupRunbookName:
    Condition: SecurityGroupModule
    Value: !Ref RevokeSecurityGroupIngressExact
  IamAccessKeyRunbookName:
    Condition: IamAccessKeyModule
    Value: !Ref DeactivateIamAccessKey
  SsmParameterRunbookName:
    Condition: SsmParameterModule
    Value: !Ref MigrateSsmParameterToSecureString
  AutomationRoleArn:
    Value: !GetAtt RemediationAutomationRole.Arn
  RemediationRoleArn:
    Value: !GetAtt RemediationAutomationRole.Arn
