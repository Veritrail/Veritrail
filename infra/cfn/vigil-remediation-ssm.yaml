AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Customer-owned Vigil remediation runbooks using AWS Systems Manager
  Automation. Each document verifies a signed remediation plan
  (vigil_remediation_plan/v2 schema), validates expiry and content
  integrity, then executes the specific remediation action.

Parameters:
  AutomationRoleName:
    Type: String
    Default: VigilRemediationAutomationRole
  EnableSecurityGroupRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableS3Remediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableIamAccessKeyRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableIamPolicyRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableSsmParameterRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableCloudTrailRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]

Conditions:
  SecurityGroupModule: !Equals [!Ref EnableSecurityGroupRemediation, "Yes"]
  S3Module: !Equals [!Ref EnableS3Remediation, "Yes"]
  IamAccessKeyModule: !Equals [!Ref EnableIamAccessKeyRemediation, "Yes"]
  IamPolicyModule: !Equals [!Ref EnableIamPolicyRemediation, "Yes"]
  SsmParameterModule: !Equals [!Ref EnableSsmParameterRemediation, "Yes"]
  CloudTrailModule: !Equals [!Ref EnableCloudTrailRemediation, "Yes"]

Resources:

  # ═══════════════════════════════════════════════════════════════════════
  # IAM Role — assumed by SSM Automation to execute all remediation steps.
  # Permissions are gated behind conditions so only enabled modules get
  # their required IAM statements at deploy time.
  # ═══════════════════════════════════════════════════════════════════════
  RemediationAutomationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref AutomationRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VigilRemediationAutomation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - !If
                - SecurityGroupModule
                - Sid: Ec2SecurityGroupIngress
                  Effect: Allow
                  Action:
                    - ec2:DescribeSecurityGroups
                    - ec2:DescribeSecurityGroupRules
                    - ec2:RevokeSecurityGroupIngress
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - S3Module
                - Sid: S3PublicAccessRemediation
                  Effect: Allow
                  Action:
                    - s3:PutBucketPublicAccessBlock
                    - s3:GetBucketPublicAccessBlock
                  Resource: "arn:aws:s3:::*"
                - !Ref AWS::NoValue
              - !If
                - SsmParameterModule
                - Sid: SsmParameterSecureStringMigration
                  Effect: Allow
                  Action:
                    - ssm:GetParameter
                    - ssm:PutParameter
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - IamAccessKeyModule
                - Sid: IamAccessKeyRemediation
                  Effect: Allow
                  Action:
                    - iam:UpdateAccessKey
                    - iam:GetAccessKeyLastUsed
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - IamPolicyModule
                - Sid: IamPolicyRemediation
                  Effect: Allow
                  Action:
                    - iam:PutRolePolicy
                    - iam:DetachRolePolicy
                    - iam:GetRolePolicy
                    - iam:GetRole
                    - iam:GetPolicy
                    - iam:ListAttachedRolePolicies
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - CloudTrailModule
                - Sid: CloudTrailRemediation
                  Effect: Allow
                  Action:
                    - cloudtrail:CreateTrail
                    - cloudtrail:UpdateTrail
                    - cloudtrail:StartLogging
                    - cloudtrail:DescribeTrails
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - CloudTrailModule
                - Sid: CloudTrailS3BucketPolicy
                  Effect: Allow
                  Action:
                    - s3:GetBucketPolicy
                    - s3:PutBucketPolicy
                  Resource: "arn:aws:s3:::*"
                - !Ref AWS::NoValue

  # ═══════════════════════════════════════════════════════════════════════
  # Vigil-RevokeSecurityGroupIngressExact
  # ═══════════════════════════════════════════════════════════════════════
  # Remediates:  ec2.security_group.unrestricted_ssh
  #              ec2.security_group.unrestricted_rdp
  # Action:      Revokes only the specific public 0.0.0.0/0 or ::/0 ingress
  #              rule authorized in the signed plan. No other rules are
  #              affected. Matches on IP protocol, port range, and CIDR.
  # ═══════════════════════════════════════════════════════════════════════
  RevokeSecurityGroupIngressExact:
    Type: AWS::SSM::Document
    Condition: SecurityGroupModule
    Properties:
      Name: Vigil-RevokeSecurityGroupIngressExact
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        schemaVersion: "0.3"
        description: >
          Vigil: Remove only the public security-group ingress rules
          authorized in a signed remediation plan. Revokes specific
          0.0.0.0/0 or ::/0 ingress rules that match the approved plan.
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: >
              Signed Vigil remediation plan JSON (vigil_remediation_plan/v2).
              Contains the exact security group rule and CIDR to revoke.
        attachments:
          handler.py:
            name: handler.py
        mainSteps:
          - name: RevokeIngress
            action: aws:executeScript
            timeoutSeconds: 180
            inputs:
              Runtime: python3.11
              Handler: handler
              InputPayload:
                PlanJson: "{{ PlanJson }}"

  # ═══════════════════════════════════════════════════════════════════════
  # Vigil-DeactivateIamAccessKey
  # ═══════════════════════════════════════════════════════════════════════
  # Remediates:  iam.access_key.unused_45d
  #              iam.access_key.unused_90d
  # Action:      Deactivates only the IAM access key identified in the
  #              signed plan by calling UpdateAccessKey with Status=Inactive.
  # ═══════════════════════════════════════════════════════════════════════
  DeactivateIamAccessKey:
    Type: AWS::SSM::Document
    Condition: IamAccessKeyModule
    Properties:
      Name: Vigil-DeactivateIamAccessKey
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        schemaVersion: "0.3"
        description: >
          Vigil: Deactivate only the IAM access key approved in a signed
          remediation plan. Validates plan integrity and expiry before
          setting the key status to Inactive.
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: >
              Signed Vigil remediation plan JSON (vigil_remediation_plan/v2)
              containing the user ARN and access key ID to deactivate.
        attachments:
          handler.py:
            name: handler.py
        mainSteps:
          - name: DeactivateAccessKey
            action: aws:executeScript
            timeoutSeconds: 120
            inputs:
              Runtime: python3.11
              Handler: handler
              InputPayload:
                PlanJson: "{{ PlanJson }}"

  # ═══════════════════════════════════════════════════════════════════════
  # Vigil-MigrateSsmParameterToSecureString
  # ═══════════════════════════════════════════════════════════════════════
  # Remediates:  ssm.parameter.plaintext_secret
  # Action:      Reads a plaintext String parameter, then rewrites it as a
  #              SecureString with the same value. If it is already
  #              SecureString, no change is made.
  # ═══════════════════════════════════════════════════════════════════════
  MigrateSsmParameterToSecureString:
    Type: AWS::SSM::Document
    Condition: SsmParameterModule
    Properties:
      Name: Vigil-MigrateSsmParameterToSecureString
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        schemaVersion: "0.3"
        description: >
          Vigil: Rewrite a reviewed plaintext SSM String parameter as
          SecureString. Verifies plan integrity and expiry, reads current
          value, and performs the migration only when the parameter is
          still a plaintext String.
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: >
              Signed Vigil remediation plan JSON (vigil_remediation_plan/v2)
              identifying the SSM parameter to migrate.
        attachments:
          handler.py:
            name: handler.py
        mainSteps:
          - name: MigrateParameter
            action: aws:executeScript
            timeoutSeconds: 120
            inputs:
              Runtime: python3.11
              Handler: handler
              InputPayload:
                PlanJson: "{{ PlanJson }}"

  # ═══════════════════════════════════════════════════════════════════════
  # Vigil-ConfigureS3BucketPublicAccessBlock
  # ═══════════════════════════════════════════════════════════════════════
  # Remediates:  s3.bucket.public_access_not_blocked
  # Action:      Enables all four Block Public Access settings on the
  #              specific S3 bucket identified in the signed plan:
  #              BlockPublicAcls, IgnorePublicAcls, BlockPublicPolicy,
  #              and RestrictPublicBuckets.
  # ═══════════════════════════════════════════════════════════════════════
  ConfigureS3BucketPublicAccessBlock:
    Type: AWS::SSM::Document
    Condition: S3Module
    Properties:
      Name: Vigil-ConfigureS3BucketPublicAccessBlock
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        schemaVersion: "0.3"
        description: >
          Vigil: Enable all four Block Public Access settings on a specific
          S3 bucket approved in a signed remediation plan. Verifies plan
          integrity, extracts the bucket name, and applies the full
          PublicAccessBlockConfiguration.
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: >
              Signed Vigil remediation plan JSON (vigil_remediation_plan/v2)
              identifying the S3 bucket to lock down.
        attachments:
          handler.py:
            name: handler.py
        mainSteps:
          - name: ConfigureBucketPublicAccessBlock
            action: aws:executeScript
            timeoutSeconds: 120
            inputs:
              Runtime: python3.11
              Handler: handler
              InputPayload:
                PlanJson: "{{ PlanJson }}"

  # ═══════════════════════════════════════════════════════════════════════
  # Vigil-RemediateIamExcessPermissions
  # ═══════════════════════════════════════════════════════════════════════
  # Remediates:  iam.policy.wildcard_resource
  #              iam.role.full_admin_policy
  # Action:      Detaches full-admin managed policies or replaces wildcard
  #              inline policies on the IAM role identified in the signed
  #              plan. The specific action (detach_full_admin or
  #              replace_wildcard_inline) is driven by the plan's
  #              supported_action field.
  # ═══════════════════════════════════════════════════════════════════════
  RemediateIamExcessPermissions:
    Type: AWS::SSM::Document
    Condition: IamPolicyModule
    Properties:
      Name: Vigil-RemediateIamExcessPermissions
      DocumentType: Automation
      DocumentFormat: YAML
      Content:
        schemaVersion: "0.3"
        description: >
          Vigil: Detach full-admin managed policies or replace wildcard
          inline policies per a signed remediation plan. Supports two
          actions — detach_full_admin and replace_wildcard_inline — both
          scoped to the specific role and policies in the plan.
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: >
              Signed Vigil remediation plan JSON (vigil_remediation_plan/v2)
              with policy details and the approved remediation action
              (detach_full_admin or replace_wildcard_inline).
        attachments:
          handler.py:
            name: handler.py
        mainSteps:
          - name: RemediateExcessPermissions
            action: aws:executeScript
            timeoutSeconds: 180
            inputs:
              Runtime: python3.11
              Handler: handler
              InputPayload:
                PlanJson: "{{ PlanJson }}"

Outputs:
  AutomationDocumentName:
    Value: Vigil-RemediationPlanExecutor
  SecurityGroupRunbookName:
    Condition: SecurityGroupModule
    Value: !Ref RevokeSecurityGroupIngressExact
  IamAccessKeyRunbookName:
    Condition: IamAccessKeyModule
    Value: !Ref DeactivateIamAccessKey
  SsmParameterRunbookName:
    Condition: SsmParameterModule
    Value: !Ref MigrateSsmParameterToSecureString
  S3BucketPabRunbookName:
    Condition: S3Module
    Value: !Ref ConfigureS3BucketPublicAccessBlock
  IamExcessPermissionsRunbookName:
    Condition: IamPolicyModule
    Value: !Ref RemediateIamExcessPermissions
  AutomationRoleArn:
    Value: !GetAtt RemediationAutomationRole.Arn
  RemediationRoleArn:
    Value: !GetAtt RemediationAutomationRole.Arn
