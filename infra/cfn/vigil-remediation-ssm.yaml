AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Vigil Remediation SSM v2026.06 — IAM role for customer-account SSM Automation
  runbooks. Deploys the IAM role and S3-backed SSM Automation documents.

Metadata:
  VigilVersion: "2026.06"
  VigilTemplate: vigil-remediation-ssm

Parameters:
  AutomationRoleName:
    Type: String
    Default: VigilRemediationAutomationRole
  SsmScriptBaseUrl:
    Type: String
    Default: https://amzn-s3-vigil.s3.us-east-1.amazonaws.com/infra/2026.06/ssm-scripts
  EnableSecurityGroupRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableS3Remediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableIamAccessKeyRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableIamPolicyRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableSsmParameterRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableCloudTrailRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]

Conditions:
  SecurityGroupModule: !Equals [!Ref EnableSecurityGroupRemediation, "Yes"]
  S3Module: !Equals [!Ref EnableS3Remediation, "Yes"]
  IamAccessKeyModule: !Equals [!Ref EnableIamAccessKeyRemediation, "Yes"]
  IamPolicyModule: !Equals [!Ref EnableIamPolicyRemediation, "Yes"]
  SsmParameterModule: !Equals [!Ref EnableSsmParameterRemediation, "Yes"]
  CloudTrailModule: !Equals [!Ref EnableCloudTrailRemediation, "Yes"]

Resources:

  # ═══════════════════════════════════════════════════════════════════════
  # IAM Role — assumed by SSM Automation to execute all remediation steps.
  # Permissions are gated behind conditions so only enabled modules get
  # their required IAM statements at deploy time.
  # ═══════════════════════════════════════════════════════════════════════
  RemediationAutomationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref AutomationRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VigilRemediationAutomation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - !If
                - SecurityGroupModule
                - Sid: Ec2SecurityGroupIngress
                  Effect: Allow
                  Action:
                    - ec2:DescribeSecurityGroups
                    - ec2:DescribeSecurityGroupRules
                    - ec2:RevokeSecurityGroupIngress
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - S3Module
                - Sid: S3PublicAccessRemediation
                  Effect: Allow
                  Action:
                    - s3:PutBucketPublicAccessBlock
                    - s3:GetBucketPublicAccessBlock
                  Resource: "arn:aws:s3:::*"
                - !Ref AWS::NoValue
              - !If
                - SsmParameterModule
                - Sid: SsmParameterSecureStringMigration
                  Effect: Allow
                  Action:
                    - ssm:GetParameter
                    - ssm:PutParameter
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - IamAccessKeyModule
                - Sid: IamAccessKeyRemediation
                  Effect: Allow
                  Action:
                    - iam:UpdateAccessKey
                    - iam:GetAccessKeyLastUsed
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - IamPolicyModule
                - Sid: IamPolicyRemediation
                  Effect: Allow
                  Action:
                    - iam:PutRolePolicy
                    - iam:DetachRolePolicy
                    - iam:GetRolePolicy
                    - iam:GetRole
                    - iam:GetPolicy
                    - iam:ListAttachedRolePolicies
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - CloudTrailModule
                - Sid: CloudTrailRemediation
                  Effect: Allow
                  Action:
                    - cloudtrail:CreateTrail
                    - cloudtrail:UpdateTrail
                    - cloudtrail:StartLogging
                    - cloudtrail:DescribeTrails
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - CloudTrailModule
                - Sid: CloudTrailS3BucketPolicy
                  Effect: Allow
                  Action:
                    - s3:GetBucketPolicy
                    - s3:PutBucketPolicy
                  Resource: "arn:aws:s3:::*"
                - !Ref AWS::NoValue
              - Sid: FetchVigilSsmScriptAttachments
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: "arn:aws:s3:::amzn-s3-vigil/infra/2026.06/ssm-scripts/*"

  # ═══════════════════════════════════════════════════════════════════════
  # SSM Automation Documents
  #
  # CloudFormation supports SSM document attachments as a top-level
  # AWS::SSM::Document Attachments property. The runbook content then
  # declares the attached file in "files" and references it from the
  # aws:executeScript step via "Attachment". Do not put "attachments"
  # under Content; SSM rejects that as an unknown document property.
  # ═══════════════════════════════════════════════════════════════════════

  RevokeSecurityGroupIngressExact:
    Type: AWS::SSM::Document
    Condition: SecurityGroupModule
    Properties:
      Name: Vigil-RevokeSecurityGroupIngressExact
      DocumentType: Automation
      DocumentFormat: YAML
      Attachments:
        - Key: S3FileUrl
          Name: revoke_sg_ingress.py
          Values:
            - !Sub "${SsmScriptBaseUrl}/revoke_sg_ingress.py"
      Content:
        schemaVersion: "0.3"
        description: >
          Vigil: Remove only the public security-group ingress rules
          authorized in a signed remediation plan. Revokes specific
          0.0.0.0/0 or ::/0 ingress rules that match the approved plan.
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: Signed Vigil remediation plan JSON (vigil_remediation_plan/v2).
        files:
          revoke_sg_ingress.py:
            checksums:
              sha256: dd23e05ee312293480d1cb9d7bfb9ff240130dada1fbb75cdbb4a6b2a1ffedc0
        mainSteps:
          - name: RevokeIngress
            action: aws:executeScript
            timeoutSeconds: 180
            inputs:
              Runtime: python3.11
              Handler: revoke_sg_ingress.handler
              Attachment: revoke_sg_ingress.py
              InputPayload:
                PlanJson: "{{ PlanJson }}"

  DeactivateIamAccessKey:
    Type: AWS::SSM::Document
    Condition: IamAccessKeyModule
    Properties:
      Name: Vigil-DeactivateIamAccessKey
      DocumentType: Automation
      DocumentFormat: YAML
      Attachments:
        - Key: S3FileUrl
          Name: deactivate_access_key.py
          Values:
            - !Sub "${SsmScriptBaseUrl}/deactivate_access_key.py"
      Content:
        schemaVersion: "0.3"
        description: >
          Vigil: Deactivate only the IAM access key approved in a signed
          remediation plan. Validates plan integrity and expiry before
          setting the key status to Inactive.
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: Signed Vigil remediation plan JSON (vigil_remediation_plan/v2).
        files:
          deactivate_access_key.py:
            checksums:
              sha256: 071ba5bf86f9c90d7225772249d9b60e2791581eb9fe2412b59ec037dfecb8b4
        mainSteps:
          - name: DeactivateAccessKey
            action: aws:executeScript
            timeoutSeconds: 120
            inputs:
              Runtime: python3.11
              Handler: deactivate_access_key.handler
              Attachment: deactivate_access_key.py
              InputPayload:
                PlanJson: "{{ PlanJson }}"

  MigrateSsmParameterToSecureString:
    Type: AWS::SSM::Document
    Condition: SsmParameterModule
    Properties:
      Name: Vigil-MigrateSsmParameterToSecureString
      DocumentType: Automation
      DocumentFormat: YAML
      Attachments:
        - Key: S3FileUrl
          Name: migrate_to_secure_string.py
          Values:
            - !Sub "${SsmScriptBaseUrl}/migrate_to_secure_string.py"
      Content:
        schemaVersion: "0.3"
        description: >
          Vigil: Rewrite a reviewed plaintext SSM String parameter as
          SecureString. Verifies plan integrity and expiry, reads current
          value, and performs the migration only when the parameter is
          still a plaintext String.
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: Signed Vigil remediation plan JSON (vigil_remediation_plan/v2).
        files:
          migrate_to_secure_string.py:
            checksums:
              sha256: 27a1b98698a546de6ba1eb9792c135e3b4233f32be7fec4cdcb554218b073338
        mainSteps:
          - name: MigrateParameter
            action: aws:executeScript
            timeoutSeconds: 120
            inputs:
              Runtime: python3.11
              Handler: migrate_to_secure_string.handler
              Attachment: migrate_to_secure_string.py
              InputPayload:
                PlanJson: "{{ PlanJson }}"

  ConfigureS3BucketPublicAccessBlock:
    Type: AWS::SSM::Document
    Condition: S3Module
    Properties:
      Name: Vigil-ConfigureS3BucketPublicAccessBlock
      DocumentType: Automation
      DocumentFormat: YAML
      Attachments:
        - Key: S3FileUrl
          Name: configure_s3_pab.py
          Values:
            - !Sub "${SsmScriptBaseUrl}/configure_s3_pab.py"
      Content:
        schemaVersion: "0.3"
        description: >
          Vigil: Enable all four Block Public Access settings on a specific
          S3 bucket approved in a signed remediation plan. Verifies plan
          integrity, extracts the bucket name, and applies the full
          PublicAccessBlockConfiguration.
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: Signed Vigil remediation plan JSON (vigil_remediation_plan/v2).
        files:
          configure_s3_pab.py:
            checksums:
              sha256: 31fd0f1f5e224235ba476f4eeb6d05c1fdcc368ce90310786d0269581ce9e9ed
        mainSteps:
          - name: ConfigureBucketPublicAccessBlock
            action: aws:executeScript
            timeoutSeconds: 120
            inputs:
              Runtime: python3.11
              Handler: configure_s3_pab.handler
              Attachment: configure_s3_pab.py
              InputPayload:
                PlanJson: "{{ PlanJson }}"

  RemediateIamExcessPermissions:
    Type: AWS::SSM::Document
    Condition: IamPolicyModule
    Properties:
      Name: Vigil-RemediateIamExcessPermissions
      DocumentType: Automation
      DocumentFormat: YAML
      Attachments:
        - Key: S3FileUrl
          Name: remediate_excess_permissions.py
          Values:
            - !Sub "${SsmScriptBaseUrl}/remediate_excess_permissions.py"
      Content:
        schemaVersion: "0.3"
        description: >
          Vigil: Detach full-admin managed policies or replace wildcard
          inline policies per a signed remediation plan. Supports two
          actions — detach_full_admin and replace_wildcard_inline — both
          scoped to the specific role and policies in the plan.
        assumeRole: !GetAtt RemediationAutomationRole.Arn
        parameters:
          PlanJson:
            type: String
            description: Signed Vigil remediation plan JSON (vigil_remediation_plan/v2).
        files:
          remediate_excess_permissions.py:
            checksums:
              sha256: 7185a966d8c272f56d9252e113353b81acb58eb6566dc929a97fd2fb1415c260
        mainSteps:
          - name: RemediateExcessPermissions
            action: aws:executeScript
            timeoutSeconds: 180
            inputs:
              Runtime: python3.11
              Handler: remediate_excess_permissions.handler
              Attachment: remediate_excess_permissions.py
              InputPayload:
                PlanJson: "{{ PlanJson }}"

Outputs:
  AutomationRoleArn:
    Value: !GetAtt RemediationAutomationRole.Arn
  RemediationRoleArn:
    Value: !GetAtt RemediationAutomationRole.Arn
  SecurityGroupRunbookName:
    Condition: SecurityGroupModule
    Value: !Ref RevokeSecurityGroupIngressExact
  IamAccessKeyRunbookName:
    Condition: IamAccessKeyModule
    Value: !Ref DeactivateIamAccessKey
  SsmParameterRunbookName:
    Condition: SsmParameterModule
    Value: !Ref MigrateSsmParameterToSecureString
  S3BucketPublicAccessBlockRunbookName:
    Condition: S3Module
    Value: !Ref ConfigureS3BucketPublicAccessBlock
  IamPolicyRunbookName:
    Condition: IamPolicyModule
    Value: !Ref RemediateIamExcessPermissions
