AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Customer-owned Vigil remediation runbooks using AWS Systems Manager
  Automation. This stack deploys the IAM Role for SSM Automation;
  the SSM documents themselves are deployed via scripts/deploy-ssm-docs.sh
  (which uses S3-hosted Python handlers with --attachments).

Parameters:
  AutomationRoleName:
    Type: String
    Default: VigilRemediationAutomationRole
  EnableSecurityGroupRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableS3Remediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableIamAccessKeyRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableIamPolicyRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableSsmParameterRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]
  EnableCloudTrailRemediation:
    Type: String
    Default: "No"
    AllowedValues: ["Yes", "No"]

Conditions:
  SecurityGroupModule: !Equals [!Ref EnableSecurityGroupRemediation, "Yes"]
  S3Module: !Equals [!Ref EnableS3Remediation, "Yes"]
  IamAccessKeyModule: !Equals [!Ref EnableIamAccessKeyRemediation, "Yes"]
  IamPolicyModule: !Equals [!Ref EnableIamPolicyRemediation, "Yes"]
  SsmParameterModule: !Equals [!Ref EnableSsmParameterRemediation, "Yes"]
  CloudTrailModule: !Equals [!Ref EnableCloudTrailRemediation, "Yes"]

Resources:

  # ═══════════════════════════════════════════════════════════════════════
  # IAM Role — assumed by SSM Automation to execute all remediation steps.
  # Permissions are gated behind conditions so only enabled modules get
  # their required IAM statements at deploy time.
  # ═══════════════════════════════════════════════════════════════════════
  RemediationAutomationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref AutomationRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ssm.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: VigilRemediationAutomation
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - !If
                - SecurityGroupModule
                - Sid: Ec2SecurityGroupIngress
                  Effect: Allow
                  Action:
                    - ec2:DescribeSecurityGroups
                    - ec2:DescribeSecurityGroupRules
                    - ec2:RevokeSecurityGroupIngress
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - S3Module
                - Sid: S3PublicAccessRemediation
                  Effect: Allow
                  Action:
                    - s3:PutBucketPublicAccessBlock
                    - s3:GetBucketPublicAccessBlock
                  Resource: "arn:aws:s3:::*"
                - !Ref AWS::NoValue
              - !If
                - SsmParameterModule
                - Sid: SsmParameterSecureStringMigration
                  Effect: Allow
                  Action:
                    - ssm:GetParameter
                    - ssm:PutParameter
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - IamAccessKeyModule
                - Sid: IamAccessKeyRemediation
                  Effect: Allow
                  Action:
                    - iam:UpdateAccessKey
                    - iam:GetAccessKeyLastUsed
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - IamPolicyModule
                - Sid: IamPolicyRemediation
                  Effect: Allow
                  Action:
                    - iam:PutRolePolicy
                    - iam:DetachRolePolicy
                    - iam:GetRolePolicy
                    - iam:GetRole
                    - iam:GetPolicy
                    - iam:ListAttachedRolePolicies
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - CloudTrailModule
                - Sid: CloudTrailRemediation
                  Effect: Allow
                  Action:
                    - cloudtrail:CreateTrail
                    - cloudtrail:UpdateTrail
                    - cloudtrail:StartLogging
                    - cloudtrail:DescribeTrails
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - CloudTrailModule
                - Sid: CloudTrailS3BucketPolicy
                  Effect: Allow
                  Action:
                    - s3:GetBucketPolicy
                    - s3:PutBucketPolicy
                  Resource: "arn:aws:s3:::*"
                - !Ref AWS::NoValue

  # ═══════════════════════════════════════════════════════════════════════
  # SSM Automation Documents are now deployed by scripts/deploy-ssm-docs.sh
  # See that script for the full list of documents, their descriptions,
  # and S3-referenced Python handler scripts with --attachments.
  # ═══════════════════════════════════════════════════════════════════════

Outputs:
  AutomationRoleArn:
    Value: !GetAtt RemediationAutomationRole.Arn
  RemediationRoleArn:
    Value: !GetAtt RemediationAutomationRole.Arn
