# Public app routes — no oauth2-proxy gate (Google OAuth branding, legal pages, SPA assets).
# Included on the __DOMAIN__ server block before the authenticated location /.

location ^~ /assets/ {
    limit_req zone=veritrail_general burst=40 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
}

location ~* ^/(favicon\.png|aws\.png|.*\.webmanifest)$ {
    limit_req zone=veritrail_general burst=40 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
}

location ~* ^/google[a-z0-9]+\.html$ {
    limit_req zone=veritrail_general burst=20 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
}

location ~ ^/(privacy|terms|login|auth/callback|reset-password)(/|$) {
    limit_req zone=veritrail_general burst=40 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
}

location = / {
    limit_req zone=veritrail_general burst=40 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
    proxy_set_header   Upgrade $http_upgrade;
    proxy_set_header   Connection $connection_upgrade;
}
