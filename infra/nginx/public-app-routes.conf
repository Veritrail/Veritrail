# Public app routes — no oauth2-proxy gate (Google OAuth branding, legal pages, SPA assets).
# Included on the __DOMAIN__ server block before the authenticated location /.

location ^~ /assets/ {
    limit_req zone=veritrail_general burst=40 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Brand assets (login-page / sidebar logo) must load before the user passes
# the oauth2-proxy gate — the login page itself is public.
location ^~ /brand/ {
    limit_req zone=veritrail_general burst=40 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

# Integration catalog logos (public/*.png under /integrations/). SPA routes share
# the /integrations prefix — only allow a single filename segment with an image ext
# (matches web/nginx/default.conf). Do not use ^~ /integrations/ (that would steal
# /integrations/github and other app pages from the authenticated SPA).
location ~* ^/integrations/[^/]+\.(png|svg|webp|jpe?g|gif|ico)$ {
    limit_req zone=veritrail_general burst=40 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location ~* ^/(favicon\.png|aws\.png|.*\.webmanifest)$ {
    limit_req zone=veritrail_general burst=40 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location ~* ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
    limit_req zone=veritrail_general burst=40 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location ~* ^/google[a-z0-9]+\.html$ {
    limit_req zone=veritrail_general burst=20 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location ~ ^/(privacy|terms|login|auth/callback|reset-password)(/|$) {
    limit_req zone=veritrail_general burst=40 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}

location = / {
    limit_req zone=veritrail_general burst=40 nodelay;
    proxy_pass         http://web:80;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $scheme;
}
