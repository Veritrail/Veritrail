# Google IAP gate (oauth2-proxy) — included when IAP_ENABLED=true
#
# Use Docker embedded DNS + variables so nginx starts even when oauth2-proxy is
# down or crash-looping (static proxy_pass resolves upstream at config load time).

resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

location @veritrail_oauth2_signin {
    return 302 /oauth2/sign_in?rd=$scheme://$host$request_uri;
}

location /oauth2/ {
    set $oauth2_upstream oauth2-proxy:4180;
    proxy_pass       http://$oauth2_upstream;
    proxy_set_header Host                    $host;
    proxy_set_header X-Real-IP               $remote_addr;
    proxy_set_header X-Forwarded-For         $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto       $scheme;
    proxy_set_header X-Auth-Request-Redirect $scheme://$host$request_uri;
}

location = /oauth2/auth {
    set $oauth2_upstream oauth2-proxy:4180;
    proxy_pass       http://$oauth2_upstream;
    proxy_set_header Host             $host;
    proxy_set_header X-Real-IP        $remote_addr;
    proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Cookie           $http_cookie;
    proxy_set_header Content-Length   "";
    proxy_pass_request_body           off;
}
