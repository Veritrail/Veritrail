# Production overrides — Hetzner/VPS prod host. Use with base compose.yml:
#   ENV_FILE=.env.prod docker compose -f compose.yml -f compose.prod.yml --env-file .env.prod --profile prod up -d
# When IAP_ENABLED=true, also pass --profile iap to start oauth2-proxy.

x-hetzner-aws-runtime: &hetzner-aws-runtime
  environment:
    AWS_SDK_LOAD_CONFIG: ${AWS_SDK_LOAD_CONFIG:-1}
    AWS_PROFILE: ${AWS_PROFILE}
    AWS_CONFIG_FILE: /root/.aws/config
    # Force boto3 onto the profile credential_process even if legacy static keys
    # are still present in .env.prod. The app strips empty AWS_* values at boot.
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    AWS_SESSION_TOKEN: ""
  volumes:
    - ${AWS_CONFIG_DIR:-/root/.aws}:/root/.aws:ro
    - /etc/veritrail/aws-ra:/etc/veritrail/aws-ra:ro
    - /usr/local/bin/aws_signing_helper:/usr/local/bin/aws_signing_helper:ro

services:
  api:
    <<: *hetzner-aws-runtime
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --workers
      - "2"
    ports: !reset []

  worker:
    <<: *hetzner-aws-runtime
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    command:
      - celery
      - -A
      - app.worker.celery_app
      - worker
      - --loglevel=info
      - --concurrency=4

  beat:
    <<: *hetzner-aws-runtime
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    command:
      - celery
      - -A
      - app.worker.celery_app
      - beat
      - --loglevel=info
      # Image runs as non-root; /app is read-only for the app user.
      - --schedule=/tmp/celerybeat-schedule

  web:
    build:
      context: .
      dockerfile: web/Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    command:
      - nginx
      - -g
      - daemon off;
    ports: !reset []
    volumes: !reset []

  nginx:
    restart: unless-stopped

  oauth2-proxy:
    restart: unless-stopped
