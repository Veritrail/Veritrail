# IAP edge gate — use with --profile iap when IAP_ENABLED=true in .env
#   docker compose -f compose.yml -f compose.prod.yml -f compose.iap.yml --profile prod --profile iap up -d
#
# nginx must NOT depend_on oauth2-proxy: if oauth2 crashes (bad IAP_COOKIE_SECRET, missing creds),
# nginx still serves /healthz; enabled.oauth2.conf uses Docker DNS resolver so nginx starts anyway.

services: {}
